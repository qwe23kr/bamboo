        // 이미지 압축 (더 빠른 업로드를 위해 더 작게)
        function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = (e) => {
const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            // 비율 유지하면서 크기 조정
                            if (width > height) {
                                if (width > maxWidth) {
                                    height = (height * maxWidth) / width;
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width = (width * maxHeight) / height;
                                    height = maxHeight;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            canvas.toBlob((blob) => {
                                if (blob) {
                                    resolve(blob);
                                } else {
                                    reject(new Error('이미지 압축 실패'));
                                }
                            }, 'image/jpeg', quality);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        // 동영상 압축 (해상도 및 비트레이트 조정)
        function compressVideo(file, maxWidth = 1280, maxHeight = 720, bitrate = 2000000) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.muted = true; // 음소거해야 재생 가능
                video.playsInline = true;
                
                const videoUrl = URL.createObjectURL(file);
                video.src = videoUrl;
                
                video.onloadedmetadata = () => {
                    try {
                        // 비율 유지하면서 크기 조정
                        let width = video.videoWidth;
                        let height = video.videoHeight;
                        const aspectRatio = width / height;
                        
                        if (width > maxWidth || height > maxHeight) {
                            if (width > height) {
                                width = Math.min(width, maxWidth);
                                height = width / aspectRatio;
                                if (height > maxHeight) {
                                    height = maxHeight;
                                    width = height * aspectRatio;
                                }
                            } else {
                                height = Math.min(height, maxHeight);
                                width = height * aspectRatio;
                                if (width > maxWidth) {
                                    width = maxWidth;
                                    height = width / aspectRatio;
                                }
                            }
                        }
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        // Canvas 스트림 생성
                        const stream = canvas.captureStream(30); // 30fps
                        
                        // 지원되는 MIME 타입 확인
                        let mimeType = 'video/webm;codecs=vp9';
                        if (!MediaRecorder.isTypeSupported(mimeType)) {
                            mimeType = 'video/webm;codecs=vp8';
                            if (!MediaRecorder.isTypeSupported(mimeType)) {
                                mimeType = 'video/webm';
                                if (!MediaRecorder.isTypeSupported(mimeType)) {
                                    // 압축 불가능하면 원본 반환
                                    URL.revokeObjectURL(videoUrl);
                                    resolve(file);
                                    return;
                                }
                            }
                        }
                        
                        const mediaRecorder = new MediaRecorder(stream, {
                            mimeType: mimeType,
                            videoBitsPerSecond: bitrate
                        });
                        
                        const chunks = [];
                        
                        mediaRecorder.ondataavailable = (e) => {
                            if (e.data && e.data.size > 0) {
                                chunks.push(e.data);
                            }
                        };
                        
                        mediaRecorder.onstop = () => {
                            URL.revokeObjectURL(videoUrl);
                            const blob = new Blob(chunks, { type: mimeType });
                            
                            // 압축된 파일이 원본보다 작으면 사용, 아니면 원본 사용
                            if (blob.size > 0 && blob.size < file.size * 0.9) {
                                resolve(blob);
                            } else {
                                resolve(file);
                            }
                        };
                        
                        mediaRecorder.onerror = (e) => {
                            URL.revokeObjectURL(videoUrl);
                            reject(new Error('동영상 압축 중 오류 발생'));
                        };
                        
                        video.oncanplay = () => {
                            mediaRecorder.start();
                            
                            const drawFrame = () => {
                                if (video.ended || video.paused) {
                                    if (mediaRecorder.state === 'recording') {
                                        mediaRecorder.stop();
                                    }
                                    return;
                                }
                                
                                ctx.drawImage(video, 0, 0, width, height);
                                
                                if (!video.ended && !video.paused) {
                                    requestAnimationFrame(drawFrame);
                                }
                            };
                            
                            video.currentTime = 0;
                            video.play().then(() => {
                                drawFrame();
                            }).catch((err) => {
                                URL.revokeObjectURL(videoUrl);
                                reject(new Error('동영상 재생 실패'));
                            });
                        };
                        
                        video.onerror = () => {
                            URL.revokeObjectURL(videoUrl);
                            reject(new Error('동영상 로드 실패'));
                        };
                    } catch (error) {
                        URL.revokeObjectURL(videoUrl);
                        reject(error);
                    }
                };
                
                video.onerror = () => {
                    URL.revokeObjectURL(videoUrl);
                    reject(new Error('동영상 로드 실패'));
                };
            });
        }
        
        // 미디어 선택 처리
        window.handleMediaSelect = async function(event) {
            try {
                const files = Array.from(event.target.files);
                const preview = document.getElementById('mediaPreview');
                
                if (!preview) {
                    return;
                }
                
                preview.innerHTML = '';
                
                if (files.length === 0) {
                    return;
                }
                
                window.selectedMedia = [];
                
                for (const file of files) {
                    const isImage = file.type.startsWith('image/');
                    const isVideo = file.type.startsWith('video/');
                    
                    if (!isImage && !isVideo) {
                        alert(`${file.name}은(는) 지원하지 않는 파일 형식입니다.`);
                        continue;
                    }
                    
                    // 파일 크기 체크 (100MB 제한)
                    const maxSize = 100 * 1024 * 1024; // 100MB
                    if (file.size > maxSize) {
                        alert(`${file.name}의 크기가 너무 큽니다. (최대 100MB)`);
                        continue;
                    }
                    
                    let processedFile = file;
                    let previewUrl = URL.createObjectURL(file);
                    
                    // 이미지인 경우 압축 (300KB 이상이면 압축)
                    if (isImage && file.size > 300 * 1024) {
                        try {
                            processedFile = await compressImage(file);
                            URL.revokeObjectURL(previewUrl); // 이전 URL 해제
                            previewUrl = URL.createObjectURL(processedFile);
                        } catch (compressError) {
                            // 압축 실패 시 원본 파일 사용
                            console.warn('이미지 압축 실패:', compressError);
                        }
                    }
                    
                    // 동영상인 경우 압축 (10MB 이상이면 압축 시도)
                    if (isVideo && file.size > 10 * 1024 * 1024) {
                        try {
                            // 동영상 압축은 시간이 걸릴 수 있으므로 사용자에게 알림
                            const compressedVideo = await compressVideo(file);
                            if (compressedVideo && compressedVideo.size < file.size) {
                                URL.revokeObjectURL(previewUrl);
                                processedFile = compressedVideo;
                                previewUrl = URL.createObjectURL(processedFile);
                            }
                        } catch (compressError) {
                            // 압축 실패 시 원본 파일 사용
                            console.warn('동영상 압축 실패:', compressError);
                        }
                    }
                    
                    window.selectedMedia.push({
                        file: processedFile,
                        type: isImage ? 'image' : 'video',
                        previewUrl: previewUrl,
                        originalName: file.name
                    });
                    
                    // 미리보기 추가
                    const mediaItem = document.createElement('div');
                    mediaItem.className = 'media-item';
                    
                    if (isImage) {
                        mediaItem.innerHTML = `<img src="${previewUrl}" alt="미리보기"><button class="remove-btn" onclick="removeMedia(${window.selectedMedia.length - 1})">×</button>`;
                    } else {
                        mediaItem.innerHTML = `<video src="${previewUrl}" controls></video><button class="remove-btn" onclick="removeMedia(${window.selectedMedia.length - 1})">×</button>`;
                    }
                    
                    preview.appendChild(mediaItem);
                }
                
                if (window.selectedMedia.length > 0) {
                }
            } catch (error) {
                alert('파일 선택 중 오류가 발생했습니다: ' + error.message);
            }
        };

        // 통합 글 작성/수정
        document.getElementById('writeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            const content = document.getElementById('writeContent').value.trim();
            const editPostId = document.getElementById('editPostId').value;
            const editTabName = document.getElementById('editTabName').value;
            const currentTab = editTabName || window.currentTab;
            const saveTab = (currentTab === 'praiseComplaint') ? (editTabName || (window.praiseComplaintSubType || 'praise')) : currentTab;
            const hasMedia = window.selectedMedia && window.selectedMedia.length > 0;
            const isEditMode = editPostId !== '';
            
            try {
                // 검증
                if (currentTab === 'daily') {
                    if (!content && !hasMedia) {
                        alert('글 또는 사진/영상을 입력해주세요.');
                        return;
                    }
                } else {
                    if (!content) {
                        alert('내용을 입력해주세요.');
                        return;
                    }
                }
                
                // 버튼 비활성화 및 로딩 표시
                submitBtn.disabled = true;
                submitBtn.textContent = isEditMode ? '수정 중...' : '업로드 중...';
                
                const userName = localStorage.getItem('bamboo_userName');
                let postId;
                let postRef;
                
                if (isEditMode) {
                    // 수정 모드
                    postId = editPostId;
                    postRef = ref(database, `posts/${saveTab}/${postId}`);
                    
                    // 본인 글 확인
                    const postSnapshot = await get(postRef);
                    if (!postSnapshot.exists() || postSnapshot.val().author !== userName) {
                        alert('본인의 글만 수정할 수 있습니다.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                        return;
                    }
                } else {
                    // 작성 모드
                    const postsRef = ref(database, `posts/${saveTab}`);
                    const newPostRef = push(postsRef);
                    postId = newPostRef.key;
                    postRef = newPostRef;
                }
                
                let mediaUrls = [];
                
                // 일상로그이고 미디어가 있는 경우 업로드
                if (saveTab === 'daily' && hasMedia) {
                    submitBtn.textContent = `업로드 중... (0/${window.selectedMedia.length})`;
                    
                    // UUID 생성 함수
                    const generateUUID = () => {
                        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                            const r = Math.random() * 16 | 0;
                            const v = c === 'x' ? r : (r & 0x3 | 0x8);
                            return v.toString(16);
                        });
                    };
                    
                    const uploadPromises = window.selectedMedia.map(async (media, i) => {
                        const uuid = generateUUID();
                        const random = Math.random().toString(36).substring(2, 15);
                        const ext = media.type === 'image'
                            ? (media.file.type === 'image/png' ? 'png' : 'jpg')
                            : (media.file.type && media.file.type.indexOf('webm') >= 0 ? 'webm' : 'mp4');
                        const fileName = `${uuid}_${Date.now()}_${random}.${ext}`;
                        const mediaStorageRef = storageRef(storage, `daily/${postId}/${fileName}`);
                        const metadata = { contentType: media.file.type || (media.type === 'image' ? 'image/jpeg' : 'video/mp4') };
                        try {
                            await uploadBytes(mediaStorageRef, media.file, metadata);
                            const downloadURL = await getDownloadURL(mediaStorageRef);
                            
                            const completed = i + 1;
                            submitBtn.textContent = `업로드 중... (${completed}/${window.selectedMedia.length})`;
                            
                            return {
                                url: downloadURL,
                                type: media.type
                            };
                        } catch (uploadError) {
                            throw new Error(`파일 업로드 실패: ${uploadError.message}`);
                        }
                    });
                    
                    mediaUrls = await Promise.all(uploadPromises);
                } else if (isEditMode && saveTab === 'daily') {
                    // 수정 모드: 기존 미디어 유지
                    const postSnapshot = await get(postRef);
                    if (postSnapshot.exists() && postSnapshot.val().media) {
                        mediaUrls = postSnapshot.val().media;
                    }
                }
                
                // 글 저장/수정 (수정 시 update 사용 → 댓글 유지)

        document.addEventListener('keydown', async (e) => {

            if (sparkleCount >= maxSparkles) return;
            
            sparkleCount++;
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            
            // 랜덤 이모지 선택

            // 랜덤 위치 오프셋
            const offsetX = (Math.random() - 0.5) * 50;
            const offsetY = (Math.random() - 0.5) * 50;
            
            sparkle.style.left = (x + offsetX) + 'px';
            sparkle.style.top = (y + offsetY) + 'px';
            
            // 랜덤 크기
            const size = 0.8 + Math.random() * 0.7;
            sparkle.style.fontSize = (size * 1.5) + 'em';

            const rotation = Math.random() * 360;
            sparkle.style.setProperty('--rotation', rotation + 'deg');
            
            document.body.appendChild(sparkle);

                // 권한이 차단된 경우
                if (permission === 'denied') {
                    alert('알림 권한이 차단되어 있습니다.\n\n브라우저 설정에서 알림을 허용해주세요:\n1. 주소창 왼쪽 자물쇠 아이콘 클릭\n2. "알림" 설정에서 "허용" 선택\n3. 페이지를 새로고침하세요.');
                    return false;
                }
                
                // 권한 요청이 필요한 경우에만 요청 (사용자 제스처가 있을 때만)
                if (permission === 'default' && requestPermission) {
                    permission = await Notification.requestPermission();
                }
                
                if (permission === 'granted') {
                    
                    // Firebase Cloud Messaging 모듈 import
                    const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js');
                    
                    // FCM 토큰 가져오기
                    const messaging = getMessaging();
                    
                    // Service Worker 등록 확인
                    let serviceWorkerRegistration = null;
                    if ('serviceWorker' in navigator) {
                        try {
                            serviceWorkerRegistration = await navigator.serviceWorker.ready;
                        } catch (error) {
                        }
                    }
                    
                    // iOS Safari 지원을 위한 Service Worker 경로 확인
                    let swPath = '/bamboo/firebase-messaging-sw.js';
                    if (window.location.pathname.includes('/bamboo/')) {
                        swPath = '/bamboo/firebase-messaging-sw.js';
                    } else {
                        swPath = '/firebase-messaging-sw.js';
                    }
                    
                    const token = await getToken(messaging, {
                        vapidKey: 'BHtWcI-zBH7NzVa1o3AFdTA-5pdYmhIizHNNCHoVGPftbRMh5iuarq3-7uxHNDffF2Z67ZGFMC9lZBuE9SC0agk',
                        serviceWorkerRegistration: serviceWorkerRegistration
                    });
                    
                    if (token) {
                        // 토큰을 Firebase Database에 저장
                        const userName = localStorage.getItem('bamboo_userName');
                        const userId = localStorage.getItem('bamboo_userId');
                        if (userName && userId) {
                            const tokenRef = ref(database, `users/${userId}/fcmToken`);
                            
                            // 기존 토큰 확인
                            const existingToken = await get(tokenRef);
                            if (existingToken.exists() && existingToken.val() === token) {
                                return;
                            }
                            
                            await set(tokenRef, token);
                            
                            // 저장 확인 (재시도 포함)
                            let retries = 3;
                            while (retries > 0) {
                                await new Promise(resolve => setTimeout(resolve, 500));
                                const savedToken = await get(tokenRef);
                                if (savedToken.exists() && savedToken.val() === token) {
                                    return;
                                }
                                retries--;
                            }
                        } else {
                        }
                    } else {
                    }
                    
                    // 포그라운드 메시지 수신
                    onMessage(messaging, (payload) => {
                        // 알림 표시
                        if (Notification.permission === 'granted') {
                            new Notification(payload.notification.title, {
                                body: payload.notification.body,
                                icon: payload.notification.icon || '/bamboo/icon-192.png'
                            });
                        }
                    });
                    
                    return true; // 성공
                } else if (permission === 'default') {
                    return false;
                } else {
                    return false;
                }
            } catch (error) {
                if (error.code === 'messaging/permission-blocked') {
                    alert('알림 권한이 차단되어 있습니다.\n\n브라우저 설정에서 알림을 허용해주세요:\n1. 주소창 왼쪽 자물쇠 아이콘 클릭\n2. "알림" 설정에서 "허용" 선택\n3. 페이지를 새로고침하세요.');
                }
                return false;
            }
        }
        
        // 알림 전송 함수 (다른 사용자들에게 알림 데이터 저장)
        async function sendNotificationToUsers(notificationData) {
            try {
                const userName = localStorage.getItem('bamboo_userName');
                const notificationsRef = ref(database, 'notifications');
                const newNotificationRef = push(notificationsRef);
                
                await set(newNotificationRef, {
                    ...notificationData,
                    author: userName,
                    createdAt: new Date().toISOString()
                });
            } catch (error) {
            }
        }
        
        // 실시간 알림 감지 및 표시
        function setupNotificationListener() {
            const currentUserName = localStorage.getItem('bamboo_userName');
            if (!currentUserName) return;
            
            const notificationsRef = ref(database, 'notifications');
            let lastNotificationTime = Date.now();
            
            onValue(notificationsRef, (snapshot) => {
                if (!snapshot.exists()) return;
                
                const notifications = snapshot.val();
                const notificationsArray = Object.entries(notifications)
                    .map(([id, notif]) => ({ id, ...notif }))
                    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                
                // 최신 알림만 확인 (본인이 작성한 것은 제외)
                notificationsArray.forEach(notif => {
                    const notifTime = new Date(notif.createdAt).getTime();
                    if (notifTime > lastNotificationTime && notif.author !== currentUserName) {
                        // 로컬 알림 표시
                        if (Notification.permission === 'granted') {
                            const notification = new Notification(notif.title, {
                                body: notif.body,
                                icon: '/bamboo/icon-192.png',
                                badge: '/bamboo/icon-192.png',
                                tag: notif.type,
                                data: {
                                    type: notif.type,
                                    tab: notif.tab,
                                    postId: notif.postId,
                                    eventId: notif.eventId
                                }
                            });
                            
                            // 알림 클릭 시 해당 탭으로 이동
                            notification.onclick = () => {
                                window.focus();
                                if (notif.type === 'post' && notif.tab) {
                                    switchTab(notif.tab);
                                } else if (notif.type === 'event') {
                                    switchTab('calendar');
                                }
                            };
                        }
                        lastNotificationTime = notifTime;
                    }
                });
            });
        }
        
        // 로그인 후 푸시 알림 초기화
        async function initNotifications(requestPermission = false) {
            const userId = localStorage.getItem('bamboo_userId');
            if (!userId) return;
            
            // 사용자 승인 상태 확인
            try {
                const userRef = ref(database, `users/${userId}`);
                const userSnapshot = await get(userRef);
                
                if (!userSnapshot.exists()) {
                    return;
                }
                
                const user = userSnapshot.val();
                const isApproved = user.approved === true || userId === 'admin' || user.name === 'admin';
                
                // 승인되지 않은 사용자는 알림 권한 요청하지 않음
                if (!isApproved) {
                    return;
                }
            } catch (error) {
                return;
            }
            
            // 권한 상태 확인
            const currentPermission = Notification.permission;
            
            // 권한이 차단된 경우
            if (currentPermission === 'denied') {
                return;
            }
            
            // FCM 토큰이 있는지 확인
            const tokenRef = ref(database, `users/${userId}/fcmToken`);
            const tokenSnapshot = await get(tokenRef);
            
            if (!tokenSnapshot.exists() || !tokenSnapshot.val()) {
                // 승인된 사용자는 자동으로 알림 권한 요청
                if (currentPermission === 'granted') {
                    await initializePushNotifications(false);
                } else if (currentPermission === 'default') {
                    // 권한이 아직 요청되지 않은 경우 자동으로 요청
                    await initializePushNotifications(true);
                }
            } else {
            }
            
            setupNotificationListener();
        }
        
        // PWA 설치 이벤트 감지
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            // preventDefault를 호출하지 않으면 브라우저가 자동으로 설치 배너를 표시합니다
            // 사용자가 설치 버튼을 클릭할 때까지 프롬프트를 보류하려면 아래 주석을 해제하세요
            // e.preventDefault();
            // deferredPrompt = e;
        });
        
        // PWA 설치 완료 이벤트
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            // 설치 후 자동으로 알림 권한 요청
            setTimeout(() => {
                initNotifications(true);
            }, 1000);
        });
        
        // 승인 상태 변경 감지
        const userId = localStorage.getItem('bamboo_userId');
        if (userId) {
            const userRef = ref(database, `users/${userId}/approved`);
            onValue(userRef, async (snapshot) => {
                if (snapshot.exists() && snapshot.val() === true) {
                    // 승인된 직후 자동으로 알림 권한 요청
                    await initNotifications(true);
                }
            });
        }
        
        // 페이지 로드 시 자동으로 알림 초기화 (승인된 사용자만)
        if (Notification.permission === 'granted') {
            // 권한이 이미 허용된 경우 자동 초기화
            initNotifications(false);
        } else {
            // 권한이 없는 경우에도 승인된 사용자면 자동 요청
            initNotifications(true);
        }
        
    </script>
